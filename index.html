<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一朝天子 · Prototype 0.3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 游戏主容器 (16:9御案布局) -->
  <div id="game-container" class="royal-desk-theme">

    <!-- 顶部天子御案总览区 (Section 50) -->
    <header id="royal-header">
      <div class="header-left">
        <button id="btn-toggle-chronicle" class="wood-btn icon-btn" title="查阅实录编年">
          <span class="btn-icon">📜</span>
          <span class="btn-text">实录</span>
        </button>
        <div class="dynasty-badge">
          <div id="dynasty-time-text" class="era-time">
            <strong>大晟</strong> · <span class="era-badge">永安元年 春</span>
          </div>
          <div id="emperor-info-text" class="emperor-status-row">
            <!-- 皇帝年龄、健康描述与储嗣年龄 -->
          </div>
        </div>
      </div>

      <!-- 四大宏观健康度概览 (降级为背景描述 + 极淡进度条, Section 41 & 50) -->
      <div class="stats-overview">
        <!-- 国库 -->
        <div class="stat-card" data-stat="treasury">
          <div class="stat-header">
            <span class="stat-label">国库</span>
            <span id="stat-desc-treasury" class="stat-desc">尚可</span>
          </div>
          <div class="stat-bar-container">
            <div id="stat-bar-treasury" class="stat-bar-fill" style="width: 55%;"></div>
          </div>
        </div>

        <!-- 民生 -->
        <div class="stat-card" data-stat="livelihood">
          <div class="stat-header">
            <span class="stat-label">民生</span>
            <span id="stat-desc-livelihood" class="stat-desc">粗安</span>
          </div>
          <div class="stat-bar-container">
            <div id="stat-bar-livelihood" class="stat-bar-fill" style="width: 60%;"></div>
          </div>
        </div>

        <!-- 国势 -->
        <div class="stat-card" data-stat="might">
          <div class="stat-header">
            <span class="stat-label">国势</span>
            <span id="stat-desc-might" class="stat-desc">可战</span>
          </div>
          <div class="stat-bar-container">
            <div id="stat-bar-might" class="stat-bar-fill" style="width: 55%;"></div>
          </div>
        </div>

        <!-- 皇威 -->
        <div class="stat-card" data-stat="authority">
          <div class="stat-header">
            <span class="stat-label">皇威</span>
            <span id="stat-desc-authority" class="stat-desc">崇严</span>
          </div>
          <div class="stat-bar-container">
            <div id="stat-bar-authority" class="stat-bar-fill" style="width: 65%;"></div>
          </div>
        </div>
      </div>

      <!-- 右侧控制区 -->
      <div class="header-right">
        <button id="btn-toggle-debug" class="wood-btn icon-btn" title="调阅秘阁推演中枢">
          <span class="btn-icon">⚙</span>
          <span class="btn-text">DEBUG</span>
        </button>
      </div>
    </header>

    <!-- 中央核心区域：左侧朝野名宿 + 中间天下三大纪事 (Section 50 & 51) -->
    <main id="board-center">
      <!-- 屏幕一侧：当前 5~8 名朝野重要人物印章卡 (Section 51) -->
      <aside id="characters-sidebar">
        <div class="sidebar-title">
          <span>朝 野 名 宿</span>
          <span class="sidebar-sub">点击可阅生平</span>
        </div>
        <div id="characters-list" class="characters-scroll">
          <!-- 动态生成活跃人物印记卡片 -->
        </div>
      </aside>

      <!-- 中央新闻御案：三大头条纪事 (天下、朝堂、宫中, Section 23 & 50) -->
      <section id="news-desk">
        <div class="desk-title-row">
          <span class="desk-title-subtle">─── 御 前 奏 闻 · 天 下 纪 事 ───</span>
        </div>
        <div id="headlines-container" class="headlines-grid">
          <!-- 动态生成 3 条核心御前头条 -->
        </div>

        <!-- 出牌后的即时反馈展卷 -->
        <div id="action-feedback-banner" class="hidden">
          <div class="feedback-seal-mark">圣 意 已 决</div>
          <div id="feedback-flavor-text" class="feedback-flavor">“圣意既决，百司奉旨遵行。”</div>
        </div>
      </section>
    </main>

    <!-- 底部：御前 5 份奏折桌案与御令操作 (Section 52~54) -->
    <footer id="royal-footer">
      <div class="footer-control-row">
        <div id="action-hint-text" class="action-hint">
          请从案头奏折中挑选一卷批复施行。<strong>每季可准一策，亦可直接退朝无为</strong>。
        </div>
        <div class="footer-buttons">
          <button id="btn-play-card" class="action-btn seal-btn disabled" disabled>
            <span class="seal-icon">朱</span>
            <span class="btn-label">朱批照准</span>
          </button>
          <button id="btn-adjourn-court" class="action-btn adjourn-btn">
            <span class="adjourn-icon">🏛</span>
            <span class="btn-label">退朝 · 无为</span>
          </button>
        </div>
      </div>

      <!-- 5 份御前奏折展区 (Section 52) -->
      <div id="proposals-container" class="proposals-row">
        <!-- 动态生成 5 张御前奏折 -->
      </div>
    </footer>

    <!-- 玉玺落印动效遮罩 (Section 53) -->
    <div id="seal-animation-overlay" class="hidden">
      <div id="imperial-seal-stamp" class="imperial-seal">
        <div class="seal-inner-frame">
          <div class="seal-text">受天之命<br>既寿永昌</div>
        </div>
      </div>
    </div>

    <!-- 侧边栏：王朝起居注与《实录》抽屉 (Section 56) -->
    <aside id="chronicle-sidebar" class="drawer-panel left-drawer">
      <div class="drawer-header">
        <h2 class="drawer-title">王朝起居注 · 《实录》</h2>
        <button id="btn-close-chronicle" class="close-btn">&times;</button>
      </div>
      <div class="chronicle-filters-row" id="chronicle-filters">
        <button class="chronicle-filter-btn active" data-category="all">全部</button>
        <button class="chronicle-filter-btn" data-category="realm">天下</button>
        <button class="chronicle-filter-btn" data-category="court">朝堂</button>
        <button class="chronicle-filter-btn" data-category="palace">宫闱</button>
        <button class="chronicle-filter-btn" data-category="action">圣意</button>
      </div>
      <div class="drawer-content">
        <div id="chronicle-list" class="chronicle-timeline">
          <!-- 动态编年史 -->
        </div>
      </div>
    </aside>

  </div>

  <!-- 启动脚本 -->
  <script type="module">
    import { GameState } from './src/game.js';
    import { UIRenderer } from './src/ui/renderer.js';
    import { CharacterPanel } from './src/ui/characterPanel.js';
    import { ChroniclePanel } from './src/ui/chroniclePanel.js';
    import { EndingPanel } from './src/ui/endingPanel.js';
    import { DebugPanel } from './src/ui/debugPanel.js';
    import { SaveManager } from './src/engine/saveManager.js';

    window.addEventListener('DOMContentLoaded', () => {
      const game = new GameState();
      const characterPanel = new CharacterPanel(game);
      const chroniclePanel = new ChroniclePanel(game);
      const endingPanel = new EndingPanel(game);
      const renderer = new UIRenderer(game, document.getElementById('game-container'), characterPanel);
      const debugPanel = new DebugPanel(game);

      game.onStateChanged = () => {
        renderer.render();
        debugPanel.update();
      };

      game.onEnactFeedback = (feedback) => {
        renderer.playEnactFeedback(feedback);
      };

      game.onSuccessionPrompt = (annals) => {
        endingPanel.show(annals);
      };

      // 朱批按钮事件
      document.getElementById('btn-play-card').addEventListener('click', () => {
        game.enactSelectedProposal();
      });

      // 退朝无为按钮事件 (Section 32 & 33)
      document.getElementById('btn-adjourn-court').addEventListener('click', () => {
        game.adjournCourt();
      });

      // 恢复存档或新局
      if (SaveManager.hasSave()) {
        const loaded = game.loadFromSave();
        if (!loaded) game.startNewGame();
      } else {
        game.startNewGame();
      }

      window.__GAME__ = game;
    });
  </script>
</body>
</html>
