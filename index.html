<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一朝天子</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 游戏主容器 (16:9比例优化) -->
  <div id="game-container" class="royal-desk-theme">

    <!-- 顶部天子御案总览区 -->
    <header id="royal-header">
      <div class="header-left">
        <button id="btn-toggle-chronicle" class="wood-btn icon-btn" title="查阅史册">
          <span class="btn-icon">📜</span>
          <span class="btn-text">史册</span>
        </button>
        <div class="dynasty-badge">
          <div id="dynasty-time" class="era-time">永和元年 春</div>
          <div id="dynasty-era" class="era-subtitle">大统第 1 / 40 季</div>
        </div>
      </div>

      <!-- 四项国家核心属性栏 -->
      <div class="stats-overview">
        <!-- 国库 -->
        <div class="stat-card" data-stat="treasury">
          <div class="stat-label">国库</div>
          <div id="stat-tier-treasury" class="stat-tier tier-good">尚可</div>
          <div class="stat-bar-container">
            <div id="stat-bar-treasury" class="stat-bar-fill tier-good" style="width: 55%;"></div>
          </div>
          <div id="stat-exact-treasury" class="stat-exact-tooltip">55/100</div>
        </div>

        <!-- 民心 -->
        <div class="stat-card" data-stat="morale">
          <div class="stat-label">民心</div>
          <div id="stat-tier-morale" class="stat-tier tier-good">安定</div>
          <div class="stat-bar-container">
            <div id="stat-bar-morale" class="stat-bar-fill tier-good" style="width: 60%;"></div>
          </div>
          <div id="stat-exact-morale" class="stat-exact-tooltip">60/100</div>
        </div>

        <!-- 军势 -->
        <div class="stat-card" data-stat="military">
          <div class="stat-label">军势</div>
          <div id="stat-tier-military" class="stat-tier tier-good">可战</div>
          <div class="stat-bar-container">
            <div id="stat-bar-military" class="stat-bar-fill tier-good" style="width: 55%;"></div>
          </div>
          <div id="stat-exact-military" class="stat-exact-tooltip">55/100</div>
        </div>

        <!-- 朝局 -->
        <div class="stat-card" data-stat="court">
          <div class="stat-label">朝局</div>
          <div id="stat-tier-court" class="stat-tier tier-good">尚稳</div>
          <div class="stat-bar-container">
            <div id="stat-bar-court" class="stat-bar-fill tier-good" style="width: 60%;"></div>
          </div>
          <div id="stat-exact-court" class="stat-exact-tooltip">60/100</div>
        </div>
      </div>

      <!-- 右侧控制区 -->
      <div class="header-right">
        <button id="btn-toggle-debug" class="wood-btn icon-btn" title="调阅秘档与测试">
          <span class="btn-icon">⚙</span>
          <span class="btn-text">DEBUG</span>
        </button>
      </div>
    </header>

    <!-- 长期状态徽章条 -->
    <div id="active-states-bar">
      <span class="states-bar-title">朝仪定规：</span>
      <div id="active-states-list" class="states-list">
        <!-- 动态生成长期状态 -->
      </div>
    </div>

    <!-- 中央核心区域：天下局势 + 水墨山河底境 -->
    <main id="board-center">
      <!-- 局势展台 (最多3张) -->
      <section id="situations-section">
        <div class="section-title-subtle">─── 天 下 局 势 ───</div>
        <div id="situations-board" class="situations-row">
          <!-- 动态生成最多3张局势牌 -->
        </div>
      </section>

      <!-- 水墨山河底境与打牌决议落印区 -->
      <section id="table-canvas-area">
        <div class="landscape-bg"></div>

        <!-- 出牌后的即时反馈展卷 -->
        <div id="action-feedback-banner" class="hidden">
          <div class="feedback-seal-mark">已奉旨</div>
          <div id="feedback-flavor-text" class="feedback-flavor">“圣意既决，百司奉旨遵行。”</div>
          <div id="feedback-stat-deltas" class="feedback-deltas"></div>
        </div>
      </section>
    </main>

    <!-- 底部：手牌奏折桌案与御令操作 -->
    <footer id="royal-footer">
      <!-- 提示与当前指令状态 -->
      <div class="footer-control-row">
        <div id="action-hint-text" class="action-hint">
          请从案头奏折中挑选一卷批复施行。每季仅可行一策。
        </div>
        <div class="footer-buttons">
          <button id="btn-play-card" class="action-btn seal-btn disabled" disabled>
            <span class="seal-icon">印</span>
            <span class="btn-label">盖印奉旨</span>
          </button>
          <button id="btn-adjourn-court" class="action-btn adjourn-btn disabled" disabled>
            <span class="adjourn-icon">🏛</span>
            <span class="btn-label">退朝</span>
          </button>
        </div>
      </div>

      <!-- 5张奏折手牌展区 -->
      <div id="hand-cards" class="hand-row">
        <!-- 动态生成5张手牌 -->
      </div>
    </footer>

    <!-- 玉玺落印动效遮罩 -->
    <div id="seal-animation-overlay" class="hidden">
      <div id="imperial-seal-stamp" class="imperial-seal">
        <div class="seal-inner-frame">
          <div class="seal-text">受天之命<br>既寿永昌</div>
        </div>
      </div>
    </div>

    <!-- 左侧：史册侧边抽屉 -->
    <aside id="chronicle-sidebar" class="drawer-panel left-drawer">
      <div class="drawer-header">
        <h2 class="drawer-title">御批史册</h2>
        <button id="btn-close-chronicle" class="close-btn">&times;</button>
      </div>
      <div class="drawer-content">
        <div id="chronicle-list" class="chronicle-timeline">
          <!-- 动态编年史 -->
        </div>
      </div>
    </aside>

    <!-- 右侧：DEBUG 抽屉 -->
    <aside id="debug-drawer" class="drawer-panel right-drawer">
      <div class="drawer-header">
        <h2 class="drawer-title">秘阁 DEBUG 监控台</h2>
        <button id="btn-close-debug" class="close-btn">&times;</button>
      </div>
      <div class="drawer-content debug-content">
        <!-- 实时信息 -->
        <fieldset class="dbg-group">
          <legend>运行状态与四维数值</legend>
          <div id="dbg-realtime-info" class="dbg-info-grid"></div>
        </fieldset>

        <!-- 局势详情 -->
        <fieldset class="dbg-group">
          <legend>当前场上局势 (上限3)</legend>
          <div id="dbg-sits-info" class="dbg-sits-list"></div>
        </fieldset>

        <!-- 权重与玩家倾向 -->
        <fieldset class="dbg-group">
          <legend>当前牌池权重分布</legend>
          <div id="dbg-weights-info" class="dbg-weights-grid"></div>
        </fieldset>

        <fieldset class="dbg-group">
          <legend>历史行为流派倾向</legend>
          <div id="dbg-tendency-info" class="dbg-text-small"></div>
        </fieldset>

        <!-- 控制指令 -->
        <fieldset class="dbg-group">
          <legend>直接干预与调试操作</legend>
          <div class="dbg-action-grid">
            <button id="dbg-btn-next-turn" class="dbg-btn">立即推进下一季</button>
            <button id="dbg-btn-godmode" class="dbg-btn">无失败模式: 关闭</button>
            <button id="dbg-btn-jump-20" class="dbg-btn">快进至第20季</button>
            <button id="dbg-btn-crisis" class="dbg-btn dbg-btn-warn">制造危机绝境</button>
            <button id="dbg-btn-clear-sits" class="dbg-btn">清空所有局势</button>
            <button id="dbg-btn-clear-states" class="dbg-btn">清空长期状态</button>
            <button id="dbg-btn-auto-sim" class="dbg-btn dbg-btn-highlight">40轮压力自测</button>
          </div>

          <div class="dbg-subgroup">
            <label>数值调整 (±5)：</label>
            <div class="dbg-stat-adjusters">
              <span>国库: <button id="dbg-btn-treasury-minus">-</button><button id="dbg-btn-treasury-plus">+</button></span>
              <span>民心: <button id="dbg-btn-morale-minus">-</button><button id="dbg-btn-morale-plus">+</button></span>
              <span>军势: <button id="dbg-btn-military-minus">-</button><button id="dbg-btn-military-plus">+</button></span>
              <span>朝局: <button id="dbg-btn-court-minus">-</button><button id="dbg-btn-court-plus">+</button></span>
            </div>
          </div>

          <div class="dbg-subgroup">
            <label>强制抽取指定卡牌：</label>
            <div class="dbg-flex-row">
              <select id="dbg-select-card" class="dbg-select"></select>
              <button id="dbg-btn-force-card" class="dbg-btn">加入手牌</button>
            </div>
          </div>

          <div class="dbg-subgroup">
            <label>强制生成指定局势：</label>
            <div class="dbg-flex-row">
              <select id="dbg-select-sit" class="dbg-select"></select>
              <button id="dbg-btn-force-sit" class="dbg-btn">生成局势</button>
            </div>
          </div>
        </fieldset>

        <!-- 种子与重启 -->
        <fieldset class="dbg-group">
          <legend>随机种子与重启</legend>
          <div class="dbg-flex-row">
            <input type="text" id="dbg-input-seed" class="dbg-input" placeholder="输入自定义 Seed">
            <button id="dbg-btn-apply-seed" class="dbg-btn">以种子重启</button>
          </div>
          <button id="dbg-btn-reset" class="dbg-btn dbg-btn-danger" style="margin-top: 8px; width: 100%;">重新开局 (清除存档)</button>
        </fieldset>

        <!-- 数据导出 -->
        <fieldset class="dbg-group">
          <legend>遥测数据导出 (用于AI平衡分析)</legend>
          <div class="dbg-flex-row">
            <button id="dbg-btn-export-json" class="dbg-btn dbg-btn-highlight">导出本局 JSON</button>
            <button id="dbg-btn-copy-json" class="dbg-btn">复制数据到剪贴板</button>
          </div>
        </fieldset>
      </div>
    </aside>

    <!-- 终局结算模态弹窗 -->
    <div id="game-over-modal" class="modal-overlay hidden">
      <div class="modal-box royal-scroll-modal">
        <div class="modal-seal-stamp">奉天承运</div>
        <h1 id="modal-dynasty-title" class="modal-title">【江山暂安】</h1>
        <p id="modal-dynasty-subtitle" class="modal-subtitle">历经四十季风雨，终得天下大定。</p>
        
        <div id="modal-summary-content" class="modal-summary">
          <!-- 动态总结内容 -->
        </div>

        <div class="modal-buttons-row">
          <button id="modal-btn-export" class="wood-btn">导出本局统计 JSON</button>
          <button id="modal-btn-copy" class="wood-btn">复制数据</button>
          <button id="modal-btn-restart" class="wood-btn btn-primary-wood">开启新一朝</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 启动脚本 -->
  <script type="module">
    import { GameState } from './src/game.js';
    import { UIRenderer } from './src/ui/renderer.js';
    import { DebugPanel } from './src/ui/debugPanel.js';
    import { ModalManager } from './src/ui/modal.js';
    import { SaveManager } from './src/engine/saveManager.js';

    window.addEventListener('DOMContentLoaded', () => {
      const game = new GameState();
      const renderer = new UIRenderer(game, document.getElementById('game-container'));
      const debugPanel = new DebugPanel(game);
      const modalManager = new ModalManager(game);

      // 绑定游戏事件与UI联动
      game.onStateChanged = (g) => {
        renderer.render();
        debugPanel.update();
      };

      game.onPlayFeedback = (result) => {
        renderer.playCardFeedback(result);
      };

      game.onGameOver = (data) => {
        modalManager.showGameOverModal(data);
      };

      // 出牌按钮
      document.getElementById('btn-play-card').addEventListener('click', () => {
        game.playSelectedCard();
      });

      // 退朝按钮
      document.getElementById('btn-adjourn-court').addEventListener('click', () => {
        game.adjournCourt();
      });

      // 尝试从本地存档恢复，若无则开启新局
      if (SaveManager.hasSave()) {
        const loaded = game.loadFromSave();
        if (!loaded) game.startNewGame();
      } else {
        game.startNewGame();
      }

      // 全局暴露便于排查
      window.__GAME__ = game;
    });
  </script>
</body>
</html>
